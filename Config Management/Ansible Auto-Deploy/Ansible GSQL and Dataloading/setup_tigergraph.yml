tasks:
  - name: Ensure TigerGraph is running
    become: true
    become_user: tigergraph
    become_method: sudo
    shell: gadmin status -v
    ignore_errors: true

  - name: Check TigerGraph status
    become: true
    become_user: tigergraph
    become_method: sudo
    shell: gadmin status
    register: tg_status

  - name: Output status
    debug:
      msg: "{{ tg_status.stdout }}"
